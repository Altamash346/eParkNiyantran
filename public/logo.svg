<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Saffron / Orange Gradient -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e1d" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Emerald Green Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Tech Blue Gradient -->
    <linearGradient id="techBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Background Badge Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.2" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Badge -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" filter="url(#glowShadow)"/>

  <!-- Subtle Inner Ring Accent -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="rgba(249, 115, 22, 0.15)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Smart Mobility Signal Waves (Top Right) -->
  <g opacity="0.9">
    <path d="M 330 110 A 170 170 0 0 1 410 190" fill="none" stroke="url(#saffronGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 350 145 A 120 120 0 0 1 405 200" fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 370 180 A 70 70 0 0 1 400 210" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Main Stylized Parking 'P' with Smart Mobility Circuit -->
  <g filter="url(#subtleGlow)">
    <!-- Vertical Spine of 'P' (Transitioning from Saffron to Emerald via White) -->
    <path d="M 150 120 L 150 392" stroke="url(#saffronGrad)" stroke-width="44" stroke-linecap="round"/>

    <!-- Upper Loop of 'P' (Connected Orbit) -->
    <path d="M 150 120 L 250 120 C 325 120, 345 160, 345 205 C 345 250, 325 290, 250 290 L 150 290" 
          fill="none" 
          stroke="url(#saffronGrad)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Inner Core Smart Vehicle Loop (Emerald Accent) -->
    <path d="M 180 160 L 240 160 C 280 160, 298 180, 298 205 C 298 230, 280 250, 240 250 L 180 250" 
          fill="none" 
          stroke="url(#emeraldGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Smart Bay IoT Sensor Nodes -->
    <!-- Node 1: Top Saffron Node -->
    <circle cx="250" cy="120" r="14" fill="#ffffff" stroke="#ea580c" stroke-width="6"/>
    
    <!-- Node 2: Center Apex Node -->
    <circle cx="345" cy="205" r="16" fill="#ffffff" stroke="#ff7e1d" stroke-width="7"/>
    
    <!-- Node 3: Bottom Return Node -->
    <circle cx="250" cy="290" r="14" fill="#ffffff" stroke="#059669" stroke-width="6"/>

    <!-- Bottom Anchor Mobility Dot (Emerald) -->
    <circle cx="150" cy="392" r="18" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="5"/>
  </g>

  <!-- Fastag / Electronic Wave Glow Path at Base -->
  <path d="M 210 370 L 320 370" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 230 405 L 295 405" stroke="rgba(255,255,255,0.7)" stroke-width="10" stroke-linecap="round"/>
</svg>
