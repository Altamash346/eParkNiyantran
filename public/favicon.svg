<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="favOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e1d" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="favGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0f172a" stroke="#ea580c" stroke-width="2"/>
  <!-- P Stem -->
  <line x1="20" y1="14" x2="20" y2="50" stroke="url(#favOrange)" stroke-width="7" stroke-linecap="round"/>
